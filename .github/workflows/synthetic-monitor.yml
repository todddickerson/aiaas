name: Synthetic monitor

# BUILD-PLAN §"Drift detection in production": every 15 minutes, probe the
# 5 critical endpoints + the homepage on the live alpha deployment. On
# regression, open (or comment on) a single tracking issue labelled
# `synthetic-monitor`; when the site recovers, close it.
#
# Sentry is still the no-op shim, so the GitHub issue IS the alert channel
# for now. Swap/extend the alert step once Sentry is provisioned.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to probe (defaults to the alpha deployment)"
        required: false
        type: string

concurrency:
  group: synthetic-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  # Repo variable wins over the hard-coded alpha URL so the DNS cutover
  # (aiaas.com) is a Settings → Variables change, not a code change.
  MONITOR_BASE_URL: ${{ inputs.base_url || vars.MONITOR_BASE_URL || 'https://aiaas-todddickerson.vercel.app' }}
  ISSUE_LABEL: synthetic-monitor
  ISSUE_TITLE: "🚨 Synthetic monitor: production regression"

jobs:
  probe:
    name: probe · alert
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lib/monitor
            scripts
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run probes
        id: probes
        # Zero-dependency: no pnpm install. Type stripping runs the .ts module.
        run: node --experimental-strip-types scripts/synthetic-monitor.mjs "$MONITOR_BASE_URL"
        continue-on-error: true

      - name: Find open tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Alert on regression
        if: steps.probes.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Ensure the label exists (idempotent).
          gh label create "$ISSUE_LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Opened automatically by the synthetic monitor" 2>/dev/null || true

          {
            cat "${{ steps.probes.outputs.report }}" 2>/dev/null || echo "Probe step did not produce a report — see run log."
            echo
            echo "Run: $RUN_URL"
          } > /tmp/body.md

          if [ -n "${{ steps.issue.outputs.number }}" ]; then
            gh issue comment "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file /tmp/body.md
          fi

      - name: Close tracking issue on recovery
        if: steps.probes.outputs.ok == 'true' && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue close "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --comment "✅ Recovered — all probes healthy. Run: $RUN_URL"

      - name: Fail job if probes failed
        if: steps.probes.outputs.ok != 'true'
        run: |
          echo "::error::Synthetic monitor detected a production regression"
          exit 1
